<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioPremiumGold</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AppCenterStudioPremiumGold </h1>
            <nav>
                <button onclick="showSection('login')">Login</button>
                <button onclick="showSection('admin')">Admin</button>
                <button onclick="showSection('studio')">Studio</button>
            </nav>
        </header>

        <main id="main-content">
            <!-- Sezione Login -->
            <section id="login" class="active">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Accedi</button>
                </form>
            </section>

            <!-- Sezione Admin -->
            <section id="admin" class="hidden">
                <h2>Pannello Amministratore</h2>
                <div class="dashboard">
                    <div class="stats">
                        <div class="stat-card">
                            <h3>Studi Attivi</h3>
                            <p id="studi-attivi">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Fatturato Mese</h3>
                            <p id="fatturato">€0</p>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <h3>Gestione Studi</h3>
                        <button onclick="creaStudio()">Crea Nuovo Studio</button>
                        <button onclick="visualizzaStudi()">Visualizza Tutti gli Studi</button>
                    </div>

                    <div id="studi-lista" class="hidden">
                        <h3>Lista Studi</h3>
                        <div id="studi-container"></div>
                    </div>
                </div>
            </section>

            <!-- Sezione Studio -->
            <section id="studio" class="hidden">
                <h2>Pannello Studio Fotografico</h2>
                <div class="menu-studio">
                    <button onclick="showStudioSection('preventivi')">Preventivi</button>
                    <button onclick="showStudioSection('clienti')">Clienti</button>
                    <button onclick="showStudioSection('foto')">Foto</button>
                    <button onclick="showStudioSection('agenda')">Agenda</button>
                    <button onclick="showStudioSection('negozio')">Negozio</button>
                </div>
                
                <div id="studio-content">
                    <p>Seleziona una sezione dal menu sopra</p>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
