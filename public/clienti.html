<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Clienti - AppCenter Studio Premium Gold</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .clienti-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .clienti-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .clienti-header h2 {
            color: #ecf0f1;
            margin: 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .clienti-list {
            display: grid;
            gap: 15px;
        }

        .cliente-card {
            background: rgba(52, 73, 94, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cliente-info {
            flex: 1;
        }

        .cliente-info h3 {
            color: #ecf0f1;
            margin: 0 0 8px 0;
            font-size: 1.2em;
        }

        .cliente-info p {
            color: #95a5a6;
            margin: 4px 0;
            font-size: 0.9em;
        }

        .cliente-actions {
            display: flex;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #ecf0f1;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #ecf0f1;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #ecf0f1;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .back-btn {
            background: #7f8c8d;
            color: white;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #6c7a7d;
        }
    </style>
</head>
<body>
    <div class="clienti-container">
        <button class="btn back-btn" onclick="window.location.href='index.html'">← Torna al Pannello</button>
        
        <div class="clienti-header">
            <h2>📇 Gestione Clienti</h2>
            <button class="btn btn-success" onclick="openModal()">+ Nuovo Cliente</button>
        </div>

        <div id="clienti-list" class="clienti-list">
            <!-- I clienti verranno caricati qui -->
        </div>
    </div>

    <!-- Modal per aggiungere/modificare cliente -->
    <div id="cliente-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Nuovo Cliente</h3>
            <form id="cliente-form">
                <input type="hidden" id="cliente-id">
                
                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="form-group">
                    <label>Cognome *</label>
                    <input type="text" id="cognome" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Telefono</label>
                    <input type="tel" id="telefono">
                </div>

                <div class="form-group">
                    <label>Indirizzo</label>
                    <input type="text" id="indirizzo">
                </div>

                <div class="form-group">
                    <label>Note</label>
                    <textarea id="note"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" style="background: #7f8c8d; color: white;" onclick="closeModal()">Annulla</button>
                    <button type="submit" class="btn btn-success">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/clienti.js"></script>
</body>
</html>
