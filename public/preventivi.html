<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Preventivi - AppCenter Studio Premium Gold</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .preventivi-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .preventivi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .preventivi-header h2 {
            color: #ecf0f1;
            margin: 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .preventivi-list {
            display: grid;
            gap: 15px;
        }

        .preventivo-card {
            background: rgba(52, 73, 94, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
        }

        .preventivo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preventivo-titolo {
            color: #ecf0f1;
            font-size: 1.2em;
            font-weight: 600;
            margin: 0;
        }

        .preventivo-importo {
            color: #2ecc71;
            font-size: 1.5em;
            font-weight: bold;
        }

        .preventivo-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preventivo-info p {
            color: #95a5a6;
            margin: 0;
            font-size: 0.9em;
        }

        .preventivo-stato {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .stato-in_attesa {
            background: #f39c12;
            color: white;
        }

        .stato-accettato {
            background: #2ecc71;
            color: white;
        }

        .stato-rifiutato {
            background: #e74c3c;
            color: white;
        }

        .preventivo-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #ecf0f1;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #ecf0f1;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #ecf0f1;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .back-btn {
            background: #7f8c8d;
            color: white;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #6c7a7d;
        }

        .cliente-select {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="preventivi-container">
        <button class="btn back-btn" onclick="window.location.href='index.html'">← Torna al Pannello</button>
        
        <div class="preventivi-header">
            <h2> Gestione Preventivi</h2>
            <button class="btn btn-success" onclick="openModal()">+ Nuovo Preventivo</button>
        </div>

        <div id="preventivi-list" class="preventivi-list">
            <!-- I preventivi verranno caricati qui -->
        </div>
    </div>

    <!-- Modal per aggiungere/modificare preventivo -->
    <div id="preventivo-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Nuovo Preventivo</h3>
            <form id="preventivo-form">
                <input type="hidden" id="preventivo-id">
                
                <div class="form-group cliente-select">
                    <label>Cliente *</label>
                    <select id="cliente-select" required>
                        <option value="">Seleziona un cliente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Titolo *</label>
                    <input type="text" id="titolo" placeholder="Es. Servizio Fotografico Matrimonio" required>
                </div>

                <div class="form-group">
                    <label>Descrizione</label>
                    <textarea id="descrizione" placeholder="Descrizione del preventivo..."></textarea>
                </div>

                <div class="form-group">
                    <label>Importo (€) *</label>
                    <input type="number" id="importo" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label>Data Scadenza</label>
                    <input type="date" id="data-scadenza">
                </div>

                <div class="form-group">
                    <label>Stato</label>
                    <select id="stato">
                        <option value="in_attesa">In attesa</option>
                        <option value="accettato">Accettato</option>
                        <option value="rifiutato">Rifiutato</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" style="background: #7f8c8d; color: white;" onclick="closeModal()">Annulla</button>
                    <button type="submit" class="btn btn-success">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/preventivi.js"></script>
</body>
</html>
